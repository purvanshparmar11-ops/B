<form
  action="https://script.google.com/macros/s/AKfycbwdZ9lD3uWUSD5m-GGiD0GHQKJP_ONEeRsAJEwdg7Hk-Vz8DtKN7WxBEyF96tNbPHG2/exec"
  method="POST">

  Name<input type="text" name="name" required><br>
  Email id <input type="email" name="email" required><br>
  Phone Number <input type="text" name="phone"><br>
  Message<textarea name="message"></textarea><br>
 
  <button type="submit">Send Inquiry</button>
</form>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const form = this;

    fetch("https://script.google.com/macros/s/AKfycbwdZ9lD3uWUSD5m-GGiD0GHQKJP_ONEeRsAJEwdg7Hk-Vz8DtKN7WxBEyF96tNbPHG2/exec", {
        method: "POST",
        body: new FormData(form),
        mode: "no-cors"
    })
    .then(() => {
        alert("Inquiry submitted successfully!");
        form.reset();
    })
    .catch(error => {
        console.error(error);
        alert("Submission failed");
    });
});
</script>
