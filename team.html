<div id="popup" class="popup">
    <div class="popup-content">
        <p id="popupMessage"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<style>
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:#fff;
    padding:25px;
    border-radius:10px;
    text-align:center;
    width:300px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.popup-content button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:#4a90e2;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}
</style>

<form
  action="https://script.google.com/macros/s/AKfycbzSg-BCiO_IKbD5u3_jxdZXGFpQa5H6XIwwMqnWJ863mEuV-ZZpH8bjF3n5pxVGS9AhgQ/exec"
  method="POST">

  Name<input type="text" name="name" required><br>
  Email id <input type="email" name="email" required><br>
  Phone Number <input type="text" name="phone"><br>
  Message<textarea name="message"></textarea><br>

  <button type="submit">Send Inquiry</button>
</form>

<script>
function showPopup(message){
    document.getElementById("popupMessage").innerText = message;
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const form = this;

    fetch("https://script.google.com/macros/s/AKfycbzSg-BCiO_IKbD5u3_jxdZXGFpQa5H6XIwwMqnWJ863mEuV-ZZpH8bjF3n5pxVGS9AhgQ/exec", {
        method: "POST",
        body: new FormData(form),
        mode: "no-cors"
    })
    .then(() => {
        showPopup("✓ Inquiry submitted successfully!");
        form.reset();
    })
    .catch(() => {
        showPopup("✗ Submission failed. Please try again.");
    });
});
</script>
